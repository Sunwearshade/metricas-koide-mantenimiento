<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Métricas de Mantenimiento</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #16203a;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #0e7490;
      --brand-2: #0891b2;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%) fixed;
      color: var(--ink);
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 16px rgba(15, 23, 42, 0.08);
      padding: 28px 24px;
    }
    .logo { display: block; max-width: 180px; height: auto; margin: 0 auto 12px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 0 0 4px; }
    p.sub { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--brand-2); border-color: transparent; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { color: var(--danger); font-size: 0.9rem; min-height: 1.2em; margin: 12px 0 0; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/assets/koide-logo-cropped.png" alt="Koide México" class="logo" />
    <h1>Métricas de Mantenimiento</h1>
    <p class="sub">Inicie sesión para continuar</p>
    <form id="login-form" autocomplete="on">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required autofocus />
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="btn-login" type="submit">Iniciar sesión</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const btn = document.getElementById("btn-login");
    const err = document.getElementById("login-error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario: form.usuario.value, password: form.password.value }),
        });
        if (res.ok) {
          location.replace("/");
          return;
        }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || "No se pudo iniciar sesión";
        form.password.value = "";
        form.password.focus();
      } catch {
        err.textContent = "No se pudo conectar con el servidor";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
